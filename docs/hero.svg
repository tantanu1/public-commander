<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>Commander: the modern Total Commander alternative</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1630"/><stop offset="1" stop-color="#1A3A80"/>
    </linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".10"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <clipPath id="c"><rect width="960" height="240" rx="22"/></clipPath>
    <style>
      .t{fill:#F2F6FF}.d{fill:#9DB3E0}
      .shine{animation:shine 5s linear infinite}
      @keyframes shine{from{transform:translateX(-300px) skewX(-20deg)}to{transform:translateX(1200px) skewX(-20deg)}}
      .logo{animation:bob 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      @keyframes bob{50%{transform:translateY(-6px)}}
      .arrow{animation:go 1.6s ease-in-out infinite}
      @keyframes go{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
      .w{opacity:0;animation:cycle 21s infinite}
      @keyframes cycle{0%{opacity:0;transform:translateY(12px)}2%,12%{opacity:1;transform:translateY(0)}14%,100%{opacity:0;transform:translateY(-12px)}}
      .p{animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
      @keyframes pop{from{opacity:0;transform:scale(.6)}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="960" height="240" fill="url(#bg)"/>
    <rect class="shine" x="0" y="-40" width="140" height="320" fill="url(#sh)"/>
    <g class="logo" transform="translate(48,52)">
      <rect width="136" height="136" rx="32" fill="#2563C8"/>
      <rect x="22" y="26" width="41" height="84" rx="9" fill="#fff"/>
      <rect x="73" y="26" width="41" height="84" rx="9" fill="#9DB9E6"/>
      <polyline class="arrow" points="52,48 74,68 52,88" fill="none" stroke="#F2B650" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="220" y="96" class="t" font-size="52" font-weight="800">Commander</text>
    <text x="222" y="130" class="d" font-size="20">Everything you love about Total Commander, rebuilt for today.</text>
    <g font-size="24" font-weight="700" fill="#F2B650" transform="translate(222,178)">
      <text class="w" style="animation-delay:0s">🦀 Written in Rust. Memory-safe, rock solid.</text>
      <text class="w" style="animation-delay:3s">⚡ Opens in 31 ms. About 15× faster than TC.</text>
      <text class="w" style="animation-delay:6s">🐧 Windows · Linux · macOS, all native.</text>
      <text class="w" style="animation-delay:9s">🧩 Plugins in any language: C, Rust, Go, Python…</text>
      <text class="w" style="animation-delay:12s">🛒 Plugin hub: browse and install in one click.</text>
      <text class="w" style="animation-delay:15s">☁️ S3 · SFTP · FTP · SMB · VMware built for it.</text>
      <text class="w" style="animation-delay:18s">💸 Free forever. MIT. No nag screen.</text>
    </g>
  </g>
</svg>
