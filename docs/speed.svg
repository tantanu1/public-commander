<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 170" width="960" height="170" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
  <title>Cold start to window: Commander 31 ms, Total Commander 459 ms</title>
  <style>
    .lbl{fill:#9DB3E0;font-size:16px}.v{font-size:16px;font-weight:700}
    .a{animation:a 6s cubic-bezier(.2,.8,.2,1) infinite}
    .b{animation:b 6s linear infinite}
    @keyframes a{0%{width:0}4%,100%{width:52px}}
    @keyframes b{0%{width:0}60%,100%{width:780px}}
    .fa{opacity:0;animation:fa 6s infinite}@keyframes fa{0%,4%{opacity:0}6%,100%{opacity:1}}
    .fb{opacity:0;animation:fb 6s infinite}@keyframes fb{0%,60%{opacity:0}62%,100%{opacity:1}}
  </style>
  <rect width="960" height="170" rx="18" fill="#0E1D40"/>
  <text x="24" y="34" fill="#F2F6FF" font-size="18" font-weight="700">Cold start → window ready (lower is better)</text>
  <text x="24" y="76" class="lbl">Commander</text>
  <rect x="170" y="60" height="24" rx="6" fill="#F2B650" class="a"/>
  <text x="232" y="78" class="v fa" fill="#F2B650">31 ms ⚡</text>
  <text x="24" y="124" class="lbl">Total Commander</text>
  <rect x="170" y="108" height="24" rx="6" fill="#4A5F8F" class="b"/>
  <text x="900" y="126" class="v fb" fill="#9DB3E0" text-anchor="end">459 ms</text>
  <text x="24" y="158" fill="#5F75A6" font-size="12">Median of 5 runs, Core Ultra 7 155H, NVMe, Windows 11. TC 11.51 x64. Details in the benchmark notes.</text>
</svg>
